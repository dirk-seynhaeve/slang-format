name: Fork release

# Builds slang-format from a tag named v<upstream version>-fork.<n>, using the upstream CI build,
# and publishes the archives with the notes in .github/fork-release-notes.md.

on:
    push:
        tags:
            - "v*-fork.*"

permissions:
    contents: write

jobs:
    build:
        uses: ./.github/workflows/build.yml
        with:
            upload_artifacts: true
            ref: ${{ github.sha }}

    release:
        needs: build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  sparse-checkout: .github/fork-release-notes.md
                  sparse-checkout-cone-mode: false

            - uses: actions/download-artifact@v4
              with:
                  pattern: slang-format-*
                  path: release-artifacts
                  merge-multiple: true

            - name: Publish GitHub release
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
                  TAG: ${{ github.ref_name }}
              run: |
                  { cat .github/fork-release-notes.md; echo; echo "Built by this repository's CI from $GITHUB_SHA."; } > notes.md
                  cd release-artifacts
                  files="slang-format-windows-x64.zip slang-format-linux-x64.tar.gz slang-format-macos.tar.gz"
                  sha256sum $files > SHA256SUMS
                  cat SHA256SUMS
                  gh release create "$TAG" $files SHA256SUMS --title "$TAG" --verify-tag --notes-file ../notes.md
